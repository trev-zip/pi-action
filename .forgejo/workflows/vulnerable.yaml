name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  actions:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@392955b6ae2230bd7cbb0d8d90051ddd9b8d537e # v1.75.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .forgejo/workflows -name "*.yaml")
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  nix:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@392955b6ae2230bd7cbb0d8d90051ddd9b8d537e # v1.75.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  npm:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@392955b6ae2230bd7cbb0d8d90051ddd9b8d537e # v1.75.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: vulnerable

      - name: Run npm audit
        run: npm audit --audit-level moderate
