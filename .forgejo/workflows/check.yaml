name: check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}

# yaml-language-server-disable is not allowed
enable-openid-connect: true

jobs:
  action:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        uses: ./. # zizmor: ignore[unpinned-uses,self-repository]
        with:
          token: ${{ secrets.PI_TOKEN }}
          base-url: ${{ secrets.PI_ACTION_BASE_URL }}
          api-key: ${{ secrets.PI_ACTION_API_KEY }}
          model: claude-haiku-5-5
          exclude-tools: bash
          dry-run: true
          prompt: .forgejo/prompts/check.md

      - name: Verify dry-run change
        run: |
          test -f .pi-action-check.txt
          grep -qxF "pi-action dry-run check" .pi-action-check.txt
          if git diff --quiet HEAD^ HEAD -- .pi-action-check.txt; then
            echo ".pi-action-check.txt was not changed by the local dry-run commit"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi

  check:
    # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@da72d9fd57cb3eaddec8dd579373dea7a1a6f35a # v1.68.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip

      - name: Check
        run: nix flake check
